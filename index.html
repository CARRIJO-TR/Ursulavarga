<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Úrsula Varga | Ensaios com IA</title>
<meta name="description" content="Úrsula Varga, modelo e especialista em ensaios com Inteligência Artificial. Acesse prompts, biblioteca e curso completo de IA.">
<meta name="theme-color" content="#1a0507">
<style>
  :root{
    --bg1:#170608;
    --bg2:#3d0f14;
    --bg3:#5c1620;
    --red:#c81e2c;
    --red-light:#ff5a5f;
    --white:#f7f2f0;
    --gold:#d9b98a;
    --muted:#e0c9c6;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.14);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    min-height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(200,30,44,0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(217,185,138,0.10), transparent 45%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    color:var(--white);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .bg-shapes{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .bg-shapes span{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.3;
  }
  .bg-shapes span:nth-child(1){
    width:280px;height:280px;
    background:radial-gradient(circle, var(--red-light), transparent 70%);
    top:-60px;left:-60px;
  }
  .bg-shapes span:nth-child(2){
    width:340px;height:340px;
    background:radial-gradient(circle, var(--gold), transparent 70%);
    bottom:-100px;right:-80px;
  }
  .bg-shapes span:nth-child(3){
    width:200px;height:200px;
    background:radial-gradient(circle, #ffffff, transparent 75%);
    top:40%;right:10%;
    opacity:0.06;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:820px;
    display:flex;
    align-items:stretch;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid var(--glass-border);
    border-radius:28px;
    overflow:hidden;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .photo-side{
    flex:0 0 42%;
    position:relative;
    min-height:100%;
  }

  .photo-side img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.05) contrast(1.02);
  }

  .photo-side::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent 60%, rgba(23,6,8,0.55) 100%);
  }

  .content-side{
    flex:1;
    padding:40px 30px 30px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  h1{
    font-size:1.7rem;
    font-weight:700;
    letter-spacing:0.5px;
    margin-bottom:6px;
    background:linear-gradient(90deg, var(--red-light), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .role{
    font-size:0.95rem;
    color:var(--muted);
    font-weight:500;
    margin-bottom:16px;
    letter-spacing:0.3px;
  }

  .tagline{
    font-size:0.92rem;
    line-height:1.5;
    color:var(--white);
    opacity:0.85;
    max-width:340px;
    margin:0 auto 28px;
    font-style:italic;
  }

  nav.links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:52px;
    padding:14px 18px;
    border-radius:16px;
    text-decoration:none;
    font-weight:600;
    font-size:0.98rem;
    color:var(--white);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 20px -10px rgba(0,0,0,0.5);
    transition:transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .btn .icon{
    font-size:1.05rem;
    opacity:0.9;
    flex-shrink:0;
  }

  .btn.primary{
    background:linear-gradient(120deg, rgba(200,30,44,0.30), rgba(217,185,138,0.18));
    border-color:rgba(200,30,44,0.45);
  }

  .btn:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.1);
    box-shadow:0 14px 28px -10px rgba(200,30,44,0.4);
  }

  .btn:active{
    transform:translateY(0) scale(0.98);
  }

  .btn:focus-visible{
    outline:2px solid var(--red-light);
    outline-offset:3px;
  }

  footer{
    margin-top:24px;
    text-align:center;
    font-size:0.75rem;
    color:var(--muted);
    opacity:0.6;
    letter-spacing:0.3px;
  }

  @media (max-width:700px){
    .card{
      flex-direction:column;
      max-width:420px;
    }
    .photo-side{
      flex:none;
      height:260px;
    }
    .photo-side::after{
      background:linear-gradient(180deg, transparent 55%, rgba(23,6,8,0.6) 100%);
    }
    .content-side{
      padding:28px 24px 24px;
    }
  }

  @media (max-width:360px){
    .content-side{padding:22px 18px 20px;}
    h1{font-size:1.45rem;}
  }

  @media (prefers-reduced-motion: reduce){
    .btn{transition:none;}
    .btn:hover{transform:none;}
  }
</style>
</head>
<body>

<div class="bg-shapes" aria-hidden="true">
  <span></span><span></span><span></span>
</div>

<main class="card">
  <div class="photo-side">
    <img src="foto1.png" alt="Foto de Úrsula Varga, modelo, usando vestido vermelho">
  </div>

  <div class="content-side">
    <h1>Úrsula Varga</h1>
    <p class="role">Modelo &amp; Especialista em Ensaios com IA</p>
    <p class="tagline">"Transformando criatividade em imagens extraordinárias com Inteligência Artificial."</p>

    <nav class="links" aria-label="Links de produtos">
      <a class="btn primary" href="https://pay.kiwify.com.br/Jg7Pmf3?afid=2bDuehav" target="_blank" rel="noopener noreferrer" aria-label="Abrir Prompts Perfeitos de IA em nova aba">
        <span class="icon" aria-hidden="true">✦</span>
        Prompts Perfeitos de IA
      </a>
      <a class="btn" href="https://pay.kiwify.com.br/pK5t1a4?afid=DlJpejM2" target="_blank" rel="noopener noreferrer" aria-label="Abrir Biblioteca de Prompts em nova aba">
        <span class="icon" aria-hidden="true">◈</span>
        Biblioteca de Prompts
      </a>
      <a class="btn" href="https://pay.kiwify.com.br/CHm0ES9?afid=aZJflHLK" target="_blank" rel="noopener noreferrer" aria-label="Abrir Escola da IA Curso Completo em nova aba">
        <span class="icon" aria-hidden="true">◆</span>
        Escola da IA (Curso Completo)
      </a>
    </nav>

    <footer>© 2026 Úrsula Varga. Todos os direitos reservados.</footer>
  </div>
</main>

</body>
</html>
