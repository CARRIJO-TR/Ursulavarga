<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Úrsula Varga - Modelo & Especialista em Ensaios com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Montserrat:wght@600&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e7e2;
  --red:#c8272a;
  --red-dark:#a11d1f;
  --brown:#5b4636;
  --white:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--brown);
  font-family:'Montserrat', sans-serif;
  overflow-x:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:24px;
}

.card{
  position:relative;
  width:100%;
  max-width:1080px;
  aspect-ratio:4/5;
  background:var(--bg);
  border-radius:6px;
  overflow:hidden;
  display:grid;
  grid-template-columns:48% 52%;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.25);
}

.photo-side{
  position:relative;
  height:100%;
  z-index:2;
}

.photo-side img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  display:block;
}

.text-side{
  position:relative;
  padding:6% 6% 6% 4%;
  display:flex;
  flex-direction:column;
  height:100%;
}

.header-block{
  display:flex;
  flex-direction:column;
}

.kicker{
  font-size:0.85rem;
  font-weight:600;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--brown);
  text-align:right;
  margin-bottom:18px;
  line-height:1.6;
}

h1{
  font-family:'Playfair Display', serif;
  font-weight:900;
  font-size:clamp(2.2rem, 8vw, 5.5rem);
  line-height:0.98;
  color:var(--brown);
  text-align:right;
  letter-spacing:-1px;
}

.spacer{
  flex:1 1 auto;
}

nav.links{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:14px 18px;
  border-radius:100px;
  text-decoration:none;
  font-family:'Poppins', sans-serif;
  font-weight:700;
  font-size:0.82rem;
  letter-spacing:0.2px;
  text-align:center;
  color:var(--white);
  background:linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
  box-shadow:0 10px 24px -8px rgba(161,29,31,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  border:none;
  transition:transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s ease, filter 0.2s ease;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}

.btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 16px 30px -8px rgba(161,29,31,0.65), inset 0 1px 0 rgba(255,255,255,0.3);
  filter:brightness(1.05);
}

.btn:active{
  transform:translateY(-1px) scale(0.99);
}

.btn:focus-visible{
  outline:2px solid var(--red-dark);
  outline-offset:3px;
}

footer{
  text-align:right;
  font-size:0.6rem;
  color:var(--brown);
  opacity:0.55;
  margin-top:14px;
  letter-spacing:0.2px;
}

/* MOBILE: card ocupa a tela cheia, foto preenche toda a altura */
@media (max-width:760px){
  body{
    padding:0;
    align-items:stretch;
    justify-content:stretch;
    min-height:100vh;
  }
  .card{
    width:100vw;
    max-width:100vw;
    height:100vh;
    aspect-ratio:auto;
    border-radius:0;
    grid-template-columns:42% 58%;
  }
  .photo-side img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:top center;
  }
  .text-side{
    padding:6% 5% 5% 3%;
  }
  .kicker{
    font-size:0.6rem;
    letter-spacing:2px;
    margin-bottom:10px;
  }
  h1{
    font-size:clamp(1.6rem, 8vw, 2.6rem);
    letter-spacing:-0.5px;
  }
  nav.links{
    gap:12px;
  }
  .btn{
    min-height:46px;
    padding:10px 12px;
    font-size:0.7rem;
  }
  footer{
    font-size:0.5rem;
    margin-top:10px;
  }
}

@media (max-width:420px){
  .card{
    grid-template-columns:40% 60%;
  }
  h1{
    font-size:clamp(1.3rem, 7vw, 2rem);
  }
  .btn{
    font-size:0.62rem;
    padding:8px 8px;
    min-height:42px;
  }
}
</style>
</head>
<body>

<div class="card">
  <div class="photo-side">
    <img src="SUBSTITUA_PELO_CAMINHO_DA_FOTO.jpg" alt="Úrsula Varga">
  </div>

  <div class="text-side">
    <div class="header-block">
      <p class="kicker">Modelo &amp; Especialista<br>em Ensaios com IA</p>
      <h1>Úrsula<br>Varga</h1>
    </div>

    <div class="spacer"></div>

    <nav class="links">
      <a href="https://pay.kiwify.com.br/Jg7Pmf3?afid=2bDuehav" class="btn" target="_blank" rel="noopener">Prompts Perfeitos de IA</a>
      <a href="https://pay.kiwify.com.br/pK5t1a4?afid=DlJpejM2" class="btn" target="_blank" rel="noopener">Biblioteca de Prompts</a>
      <a href="https://pay.kiwify.com.br/CHm0ES9?afid=aZJflHLK" class="btn" target="_blank" rel="noopener">Escola da IA (Curso Completo)</a>
    </nav>

    <footer>© 2026 Úrsula Varga. Todos os direitos reservados.</footer>
  </div>
</div>

</body>
</html>
